name: Compiler Claude Bridge (Archicad 28 Windows)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compiler l'Add-On
        shell: bash
        run: python Tools/BuildAddOn.py --configFile config.json --acVersion 28 --buildConfig RelWithDebInfo

      - name: Lister les fichiers produits
        shell: bash
        run: find Build -name "*.apx"

      - name: Publier le fichier .apx (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeBridge-AC28-Windows
          path: Build/**/*.apx
          if-no-files-found: error

      # Chaque compilation reussie sur main devient la "derniere version",
      # telechargeable sans compte a l'adresse :
      # https://github.com/<compte>/<depot>/releases/latest/download/ClaudeBridge.apx
      - name: Publier la derniere version (release)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APX=$(find Build -name "ClaudeBridge.apx" | head -1)
          cp "$APX" ClaudeBridge.apx
          VERSION=$(python -c "import json; print(json.load(open('config.json'))['version'])")
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ClaudeBridge.apx \
            --title "Claude Bridge $VERSION" \
            --notes "Version $VERSION, compilee depuis le commit ${GITHUB_SHA::7}." \
            --latest
